name: Shared (.NET)

on:
  workflow_call:
    inputs:
      fetch-depth:
        description: "Git fetch depth. 0 = full history (MinVer needs tags for versioning)."
        required: false
        type: number
        default: 0

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore DotVgn.slnx --locked-mode

      - name: Format check
        run: dotnet format DotVgn.slnx --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build DotVgn.slnx --no-restore --configuration Release

      - name: Test & Coverage
        run: |
          dotnet test --solution DotVgn.slnx \
            --no-build \
            --configuration Release \
            --results-directory ./coverage-results \
            -- --coverage --coverage-output-format cobertura --ignore-exit-code 8

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-results
          path: ./coverage-results/
          retention-days: 14

      - name: Security audit
        run: dotnet list DotVgn.slnx package --vulnerable --include-transitive
